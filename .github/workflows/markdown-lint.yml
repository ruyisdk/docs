name: Markdown Lint

on:
  push:
    branches:
      - restructure-zh
  pull_request:
    branches:
      - restructure-zh
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: 'docs/**/*.{md,mdx}'
          fix: false